name: Build CustomChaos Fabric 26.2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Verify version lock
        shell: bash
        run: |
          if grep -R "26\.3" -n . --exclude-dir=.git; then
            echo "ERROR: Minecraft 26.3 reference found."
            exit 1
          fi
          echo "Minecraft version lock: 26.2"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomChaos-Fabric-26.2
          path: build/libs/*.jar
